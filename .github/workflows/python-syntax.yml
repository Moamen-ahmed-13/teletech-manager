name: Python syntax and As-Built tests

on:
  push:
    branches:
      - Moamen-ahmed-13-patch-1
  pull_request:
    branches:
      - Moamen-ahmed-13-patch-1

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install As-Built test dependencies
        run: python -m pip install -r requirements-asbuilt.txt
      - name: Install reconciliation test dependencies
        run: python -m pip install openpyxl
      - name: Install invoice OCR fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
      - name: Compile changed Python modules
        run: python -m py_compile server.py recon_module.py recon_ui.py recon_vision.py asbuilt_apply.py asbuilt_arrow.py asbuilt_registration.py asbuilt_markups.py asbuilt_pipeline.py dxfmini.py dxfedit.py render.py
      - name: Run reconciliation and As-Built unit tests
        run: python -m unittest discover -s tests -v
